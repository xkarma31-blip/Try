<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Blobz.io</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="score">Mass: 0</div>
    <div id="leaderboard">
      <h3>Leaderboard</h3>
      <ol id="leaderboard-list"></ol>
    </div>
  </div>

  <div id="start-screen">
    <div class="panel">
      <h1>Blobz<span>.io</span></h1>
      <p>Eat food and smaller blobs to grow. Avoid bigger blobs!</p>
      <input id="name-input" type="text" maxlength="16" placeholder="Player 1 name" />
      <input id="name-input-2" type="text" maxlength="16" placeholder="Player 2 name" />
      <div class="mode-buttons">
        <button id="play-1p">1 Player</button>
        <button id="play-2p">2 Players (Local)</button>
      </div>
      <p class="hint" id="start-hint">
        1P: move the mouse (or drag) to steer. 2P Local: each player uses a
        touch joystick on their half of the screen.
      </p>
    </div>
  </div>

  <div id="end-screen" class="hidden">
    <div class="panel">
      <h1>Game Over</h1>
      <p id="end-message"><span id="final-score">0</span></p>
      <button id="restart-btn">Play Again</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
